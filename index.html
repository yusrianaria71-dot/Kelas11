<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari Belajar Penjumlahan!</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Baloo 2 for a friendly, child-like appearance -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for animations and specific overrides */
        body {
            font-family: 'Baloo 2', cursive;
            background-color: #f0fdf4; /* Light green background */
            /* Prevent text selection to avoid accidental highlighting by kids */
            user-select: none; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            overflow-x: hidden;
        }

        /* Animation for bouncing elements */
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s infinite ease-in-out;
        }

        /* Animation for correct answer celebration */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.5s ease-in-out;
        }

        /* Shake animation for wrong answer */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Style for the fruits (apples, oranges, etc.) */
        .fruit-icon {
            font-size: 2.5rem; /* Large size for kids */
            margin: 2px;
            display: inline-block;
            transition: transform 0.2s;
        }
        .fruit-icon:hover {
            transform: scale(1.1);
        }

        /* Number button styling */
        .number-btn {
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .number-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        /* Hide sections initially */
        .hidden-section {
            display: none;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <canvas id="confetti-canvas"></canvas>

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-green-400 relative">
        
        <!-- Header/Navigation Bar (visible in learn and play modes) -->
        <div id="nav-bar" class="hidden-section bg-green-400 text-white p-3 flex justify-between items-center rounded-t-2xl">
            <button onclick="showHome()" class="text-white hover:text-green-100 p-2 rounded-full hover:bg-green-500 transition-colors">
                <i class="fa-solid fa-house text-xl"></i>
            </button>
            <h2 id="section-title" class="text-xl font-bold">Belajar</h2>
            <div id="score-display" class="hidden-section font-bold text-lg bg-white text-green-500 px-3 py-1 rounded-full border-2 border-green-500">
                <i class="fa-solid fa-star text-yellow-400"></i> <span id="score-val">0</span>
            </div>
            <div id="dummy-space" class="w-10"></div> <!-- To keep title centered if score is hidden -->
        </div>

        <!-- HOME SCREEN -->
        <div id="home-screen" class="p-8 text-center flex flex-col items-center justify-center min-h-[400px]">
            <h1 class="text-4xl font-extrabold text-green-600 mb-2 animate-bounce-slow">Halo Teman-teman!</h1>
            <p class="text-xl text-gray-600 mb-8">Mari kita belajar penjumlahan bersama.</p>
            
            <div class="flex justify-center space-x-4 mb-8">
                <i class="fa-solid fa-apple-whole text-red-500 text-5xl"></i>
                <i class="fa-solid fa-plus text-gray-400 text-4xl self-center"></i>
                <i class="fa-solid fa-apple-whole text-red-500 text-5xl"></i>
            </div>

            <div class="flex flex-col w-full space-y-4">
                <button onclick="startLearnMode()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-2xl text-2xl shadow-[0_5px_0_0_rgba(29,78,216,1)] transition-transform active:translate-y-[5px] active:shadow-none flex items-center justify-center gap-3">
                    <i class="fa-solid fa-book-open"></i> Ayo Belajar
                </button>
                <button onclick="startPlayMode()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-white font-bold py-4 px-6 rounded-2xl text-2xl shadow-[0_5px_0_0_rgba(202,138,4,1)] transition-transform active:translate-y-[5px] active:shadow-none flex items-center justify-center gap-3">
                    <i class="fa-solid fa-gamepad"></i> Ayo Bermain
                </button>
            </div>
        </div>

        <!-- LEARN MODE SCREEN -->
        <div id="learn-screen" class="hidden-section p-6 min-h-[400px] flex flex-col">
            <div class="text-center mb-4">
                <p class="text-lg text-gray-600 font-semibold">Perhatikan gambar di bawah ini ya!</p>
            </div>
            
            <!-- Visualization Area -->
            <div class="bg-blue-50 rounded-2xl p-6 mb-6 flex flex-col items-center justify-center border-2 border-blue-200 flex-grow">
                
                <!-- Equation representation with fruits -->
                <div class="flex flex-wrap justify-center items-center gap-4 mb-6 min-h-[80px]">
                    <!-- Group 1 -->
                    <div id="learn-group1" class="flex flex-wrap justify-center bg-white p-3 rounded-xl shadow-sm border border-gray-100 min-w-[60px]">
                        <!-- Fruits will be injected here -->
                    </div>
                    
                    <!-- Plus Sign -->
                    <div class="text-3xl font-bold text-gray-500"><i class="fa-solid fa-plus"></i></div>
                    
                    <!-- Group 2 -->
                    <div id="learn-group2" class="flex flex-wrap justify-center bg-white p-3 rounded-xl shadow-sm border border-gray-100 min-w-[60px]">
                        <!-- Fruits will be injected here -->
                    </div>
                    
                    <!-- Equals Sign -->
                    <div class="text-3xl font-bold text-gray-500"><i class="fa-solid fa-equals"></i></div>
                    
                    <!-- Result Group (initially empty or showing question mark, then filled) -->
                    <div id="learn-result-group" class="flex flex-wrap justify-center bg-yellow-50 p-3 rounded-xl shadow-inner border-2 border-yellow-200 min-w-[80px] min-h-[80px]">
                        <!-- Fruits or ? will be injected here -->
                    </div>
                </div>

                <!-- Number representation -->
                <div class="flex items-center justify-center gap-4 text-4xl font-extrabold text-gray-700">
                    <span id="learn-num1" class="text-blue-500">1</span>
                    <span class="text-gray-400 text-3xl">+</span>
                    <span id="learn-num2" class="text-green-500">2</span>
                    <span class="text-gray-400 text-3xl">=</span>
                    <span id="learn-result-num" class="text-yellow-500">?</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex justify-between mt-auto">
                <button id="btn-learn-prev" onclick="prevLearnStep()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Kembali
                </button>
                <button id="btn-learn-next" onclick="nextLearnStep()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-[0_4px_0_0_rgba(29,78,216,1)] transition-transform active:translate-y-[4px] active:shadow-none flex items-center gap-2">
                    Lanjut <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- PLAY MODE SCREEN (QUIZ) -->
        <div id="play-screen" class="hidden-section p-6 min-h-[450px] flex flex-col">
            
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4">
                <div id="progress-bar" class="bg-green-500 h-2.5 rounded-full" style="width: 10%"></div>
            </div>

            <div class="text-center mb-4">
                <h3 class="text-2xl font-bold text-gray-700">Berapa jumlahnya?</h3>
            </div>

            <!-- Visualization Area -->
            <div class="bg-white rounded-2xl p-4 mb-6 flex flex-col items-center justify-center border-2 border-dashed border-gray-300 flex-grow">
                
                <!-- Equation representation with fruits -->
                <div class="flex flex-wrap justify-center items-center gap-2 mb-4">
                    <!-- Group 1 -->
                    <div id="play-group1" class="flex flex-wrap justify-center min-w-[50px] max-w-[120px]">
                        <!-- Fruits -->
                    </div>
                    
                    <div class="text-2xl font-bold text-gray-400 mx-2"><i class="fa-solid fa-plus"></i></div>
                    
                    <!-- Group 2 -->
                    <div id="play-group2" class="flex flex-wrap justify-center min-w-[50px] max-w-[120px]">
                        <!-- Fruits -->
                    </div>
                </div>

                <!-- Number representation -->
                <div class="flex items-center justify-center gap-3 text-5xl font-extrabold text-gray-700 mt-2">
                    <span id="play-num1" class="text-blue-500"></span>
                    <span class="text-gray-400 text-4xl">+</span>
                    <span id="play-num2" class="text-green-500"></span>
                    <span class="text-gray-400 text-4xl">=</span>
                    <span id="play-answer-box" class="inline-block w-16 h-16 border-4 border-yellow-400 rounded-xl bg-yellow-50 text-center leading-[3.5rem] text-yellow-600">?</span>
                </div>
            </div>

            <!-- Feedback Area -->
            <div id="feedback-area" class="h-12 mb-4 flex items-center justify-center">
                <!-- Messages will appear here (Correct/Incorrect) -->
            </div>

            <!-- Options Area -->
            <div id="options-container" class="grid grid-cols-3 gap-4 mt-auto">
                <!-- Buttons will be generated here -->
            </div>
            
            <button id="btn-next-question" onclick="generateQuestion()" class="hidden w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-xl text-xl mt-4 shadow-[0_4px_0_0_rgba(29,78,216,1)] active:translate-y-[4px] active:shadow-none">
                Soal Berikutnya <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="hidden-section p-8 text-center flex flex-col items-center justify-center min-h-[400px]">
            <div class="text-6xl text-yellow-400 mb-4 animate-bounce-slow">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h1 class="text-4xl font-extrabold text-green-600 mb-2">Hebat Sekali!</h1>
            <p class="text-xl text-gray-600 mb-6">Kamu telah menyelesaikan permainan.</p>
            
            <div class="bg-yellow-50 border-4 border-yellow-200 rounded-2xl p-6 mb-8 w-full">
                <p class="text-lg text-gray-500 font-bold mb-2">Skor Kamu</p>
                <div class="flex items-center justify-center gap-3">
                    <i class="fa-solid fa-star text-4xl text-yellow-400"></i>
                    <span id="final-score" class="text-6xl font-extrabold text-yellow-500">100</span>
                </div>
            </div>

            <div class="flex flex-col w-full space-y-4">
                <button onclick="startPlayMode()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-2xl text-xl shadow-[0_5px_0_0_rgba(29,78,216,1)] transition-transform active:translate-y-[5px] active:shadow-none">
                    <i class="fa-solid fa-rotate-right mr-2"></i> Main Lagi
                </button>
                <button onclick="showHome()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-2xl text-xl">
                    <i class="fa-solid fa-house mr-2"></i> Kembali ke Awal
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- State Variables ---
        let currentMode = 'home'; // home, learn, play, result
        
        // Learn Mode State
        const learnLessons = [
            { n1: 1, n2: 1, icon: '<i class="fa-solid fa-apple-whole text-red-500"></i>', color1: 'text-blue-500', color2: 'text-green-500' },
            { n1: 2, n2: 1, icon: '<i class="fa-solid fa-lemon text-yellow-400"></i>', color1: 'text-blue-500', color2: 'text-green-500' },
            { n1: 2, n2: 2, icon: '<i class="fa-solid fa-carrot text-orange-500"></i>', color1: 'text-blue-500', color2: 'text-green-500' },
            { n1: 3, n2: 2, icon: '<i class="fa-solid fa-star text-yellow-400"></i>', color1: 'text-blue-500', color2: 'text-green-500' },
            { n1: 4, n2: 3, icon: '<i class="fa-solid fa-heart text-red-500"></i>', color1: 'text-blue-500', color2: 'text-green-500' },
            { n1: 5, n2: 5, icon: '<i class="fa-solid fa-paw text-gray-700"></i>', color1: 'text-blue-500', color2: 'text-green-500' }
        ];
        let currentLearnStep = 0;
        let isResultRevealed = false; // For step-by-step reveal in learn mode

        // Play Mode State
        let currentQuestion = 1;
        const totalQuestions = 10;
        let score = 0;
        let playN1, playN2, correctAnswer;
        const icons = [
            '<i class="fa-solid fa-apple-whole text-red-500"></i>',
            '<i class="fa-solid fa-lemon text-yellow-400"></i>',
            '<i class="fa-solid fa-carrot text-orange-500"></i>',
            '<i class="fa-solid fa-star text-yellow-400"></i>',
            '<i class="fa-solid fa-bug text-green-600"></i>',
            '<i class="fa-solid fa-fish text-blue-500"></i>'
        ];

        // --- Navigation Functions ---
        function hideAllScreens() {
            document.getElementById('home-screen').classList.add('hidden-section');
            document.getElementById('learn-screen').classList.add('hidden-section');
            document.getElementById('play-screen').classList.add('hidden-section');
            document.getElementById('result-screen').classList.add('hidden-section');
            document.getElementById('nav-bar').classList.add('hidden-section');
            document.getElementById('score-display').classList.add('hidden-section');
            document.getElementById('dummy-space').classList.remove('hidden-section');
        }

        function showHome() {
            hideAllScreens();
            document.getElementById('home-screen').classList.remove('hidden-section');
            currentMode = 'home';
        }

        // --- STREAMING_CHUNK:JavaScript Logic - Learn Mode ---
        function startLearnMode() {
            hideAllScreens();
            document.getElementById('learn-screen').classList.remove('hidden-section');
            document.getElementById('nav-bar').classList.remove('hidden-section');
            document.getElementById('section-title').innerText = "Belajar Penjumlahan";
            currentMode = 'learn';
            currentLearnStep = 0;
            renderLearnStep();
        }

        function renderLearnStep() {
            const lesson = learnLessons[currentLearnStep];
            isResultRevealed = false;

            // Update Numbers
            const num1El = document.getElementById('learn-num1');
            const num2El = document.getElementById('learn-num2');
            const resultNumEl = document.getElementById('learn-result-num');
            
            num1El.innerText = lesson.n1;
            num2El.innerText = lesson.n2;
            resultNumEl.innerText = "?";
            resultNumEl.className = "text-yellow-500"; // reset color

            // Render Icons
            document.getElementById('learn-group1').innerHTML = generateIcons(lesson.icon, lesson.n1);
            document.getElementById('learn-group2').innerHTML = generateIcons(lesson.icon, lesson.n2);
            document.getElementById('learn-result-group').innerHTML = '<span class="text-4xl text-gray-300 font-bold">?</span>';

            // Button States
            document.getElementById('btn-learn-prev').disabled = currentLearnStep === 0;
            document.getElementById('btn-learn-prev').classList.toggle('opacity-50', currentLearnStep === 0);
            
            const nextBtn = document.getElementById('btn-learn-next');
            nextBtn.innerHTML = 'Hitung <i class="fa-solid fa-calculator"></i>';
            nextBtn.onclick = revealLearnResult;
        }

        function revealLearnResult() {
            const lesson = learnLessons[currentLearnStep];
            const sum = lesson.n1 + lesson.n2;

            // Update Result Number
            const resultNumEl = document.getElementById('learn-result-num');
            resultNumEl.innerText = sum;
            resultNumEl.className = "text-green-500 animate-pop inline-block";

            // Update Result Icons
            document.getElementById('learn-result-group').innerHTML = generateIcons(lesson.icon, sum);
            
            // Add slight animation to new fruits
            const resultFruits = document.getElementById('learn-result-group').children;
            for(let i=0; i<resultFruits.length; i++) {
                resultFruits[i].classList.add('animate-pop');
                resultFruits[i].style.animationDelay = `${i * 0.1}s`;
            }

            // Update Button
            isResultRevealed = true;
            const nextBtn = document.getElementById('btn-learn-next');
            if (currentLearnStep < learnLessons.length - 1) {
                nextBtn.innerHTML = 'Lanjut <i class="fa-solid fa-arrow-right"></i>';
                nextBtn.onclick = nextLearnStep;
            } else {
                nextBtn.innerHTML = 'Selesai <i class="fa-solid fa-check"></i>';
                nextBtn.onclick = showHome;
            }
        }

        function nextLearnStep() {
            if (isResultRevealed && currentLearnStep < learnLessons.length - 1) {
                currentLearnStep++;
                renderLearnStep();
            } else if (!isResultRevealed) {
                revealLearnResult();
            }
        }

        function prevLearnStep() {
            if (currentLearnStep > 0) {
                currentLearnStep--;
                renderLearnStep();
            }
        }

        function generateIcons(iconHtml, count) {
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `<span class="fruit-icon">${iconHtml}</span>`;
            }
            return html;
        }

        // --- STREAMING_CHUNK:JavaScript Logic - Play Mode ---
        function startPlayMode() {
            hideAllScreens();
            document.getElementById('play-screen').classList.remove('hidden-section');
            document.getElementById('nav-bar').classList.remove('hidden-section');
            document.getElementById('score-display').classList.remove('hidden-section');
            document.getElementById('dummy-space').classList.add('hidden-section');
            document.getElementById('section-title').innerText = "Bermain";
            
            currentMode = 'play';
            currentQuestion = 1;
            score = 0;
            updateScoreDisplay();
            generateQuestion();
        }

        function generateQuestion() {
            // Hide next button, clear feedback
            document.getElementById('btn-next-question').classList.add('hidden');
            document.getElementById('feedback-area').innerHTML = '';
            
            // Reset answer box
            const answerBox = document.getElementById('play-answer-box');
            answerBox.innerText = "?";
            answerBox.className = "inline-block w-16 h-16 border-4 border-yellow-400 rounded-xl bg-yellow-50 text-center leading-[3.5rem] text-yellow-600";

            // Update progress bar
            const progress = ((currentQuestion - 1) / totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Generate random numbers (Sum max 10)
            correctAnswer = Math.floor(Math.random() * 9) + 2; // Result between 2 and 10
            playN1 = Math.floor(Math.random() * (correctAnswer - 1)) + 1; // N1 between 1 and correctAnswer-1
            playN2 = correctAnswer - playN1;

            // Pick random icon
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];

            // Render Question
            document.getElementById('play-num1').innerText = playN1;
            document.getElementById('play-num2').innerText = playN2;
            document.getElementById('play-group1').innerHTML = generateIcons(randomIcon, playN1);
            document.getElementById('play-group2').innerHTML = generateIcons(randomIcon, playN2);

            generateOptions();
        }

        function generateOptions() {
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Generate 3 unique options including the correct answer
            let options = [correctAnswer];
            while (options.length < 3) {
                // Generate wrong answer close to correct answer, ensuring it's between 1 and 10
                let wrong = correctAnswer + (Math.floor(Math.random() * 5) - 2); 
                if (wrong < 1) wrong = 1;
                if (wrong > 10) wrong = 10;
                
                if (!options.includes(wrong)) {
                    options.push(wrong);
                }
            }

            // Shuffle options
            options.sort(() => Math.random() - 0.5);

            // Render buttons
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "number-btn bg-white border-4 border-blue-200 hover:border-blue-400 hover:bg-blue-50 text-blue-600 font-extrabold text-3xl py-4 rounded-2xl";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, btnElement) {
            // Disable all option buttons
            const buttons = document.getElementById('options-container').querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-70', 'cursor-not-allowed');
            });

            const answerBox = document.getElementById('play-answer-box');
            const feedbackArea = document.getElementById('feedback-area');

            if (selected === correctAnswer) {
                // Correct
                score += 10;
                updateScoreDisplay();
                
                btnElement.classList.replace('border-blue-200', 'border-green-500');
                btnElement.classList.replace('bg-white', 'bg-green-100');
                btnElement.classList.add('animate-pop');

                answerBox.innerText = selected;
                answerBox.className = "inline-block w-16 h-16 border-4 border-green-500 rounded-xl bg-green-100 text-center leading-[3.5rem] text-green-600 animate-pop font-extrabold";

                feedbackArea.innerHTML = `<div class="bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold animate-bounce-slow"><i class="fa-solid fa-check-circle mr-1"></i> Pintar Sekali!</div>`;
                
                fireConfetti();
            } else {
                // Incorrect
                btnElement.classList.replace('border-blue-200', 'border-red-400');
                btnElement.classList.replace('bg-white', 'bg-red-50');
                btnElement.classList.add('animate-shake');

                // Find and highlight correct answer
                buttons.forEach(b => {
                    if (parseInt(b.innerText) === correctAnswer) {
                        b.classList.replace('border-blue-200', 'border-green-500');
                        b.classList.replace('text-blue-600', 'text-green-600');
                        b.classList.add('animate-pop');
                    }
                });

                answerBox.innerText = correctAnswer;
                answerBox.className = "inline-block w-16 h-16 border-4 border-red-400 rounded-xl bg-red-50 text-center leading-[3.5rem] text-red-500 font-extrabold";

                feedbackArea.innerHTML = `<div class="bg-red-100 text-red-600 px-4 py-2 rounded-full font-bold animate-shake"><i class="fa-solid fa-times-circle mr-1"></i> Ops, jawabannya ${correctAnswer}</div>`;
            }

            // Show Next Button
            const nextBtn = document.getElementById('btn-next-question');
            nextBtn.classList.remove('hidden');
            
            if (currentQuestion >= totalQuestions) {
                nextBtn.innerHTML = 'Lihat Hasil <i class="fa-solid fa-flag-checkered ml-2"></i>';
                nextBtn.onclick = showResult;
            } else {
                nextBtn.innerHTML = 'Soal Berikutnya <i class="fa-solid fa-arrow-right ml-2"></i>';
                nextBtn.onclick = () => {
                    currentQuestion++;
                    generateQuestion();
                };
            }
        }

        function updateScoreDisplay() {
            document.getElementById('score-val').innerText = score;
        }

        // --- STREAMING_CHUNK:JavaScript Logic - Result and Effects ---
        function showResult() {
            hideAllScreens();
            document.getElementById('result-screen').classList.remove('hidden-section');
            document.getElementById('final-score').innerText = score;
            currentMode = 'result';
            fireConfettiBurst();
        }

        // Basic Confetti Implementation (No external libraries needed)
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfetti(x, y, color) {
            return {
                x: x,
                y: y,
                w: Math.random() * 10 + 5,
                h: Math.random() * 5 + 5,
                dx: Math.random() * 10 - 5,
                dy: Math.random() * -10 - 5,
                gravity: 0.5,
                color: color,
                rotation: Math.random() * 360,
                rotationSpeed: Math.random() * 10 - 5
            };
        }

        const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa'];

        function fireConfetti() {
            const rect = document.getElementById('play-answer-box').getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top;

            for (let i = 0; i < 30; i++) {
                particles.push(createConfetti(startX, startY, colors[Math.floor(Math.random() * colors.length)]));
            }
            if (!animationId) animateConfetti();
        }

        function fireConfettiBurst() {
            for (let i = 0; i < 150; i++) {
                particles.push(createConfetti(canvas.width / 2, canvas.height / 2, colors[Math.floor(Math.random() * colors.length)]));
            }
            if (!animationId) animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.dy += p.gravity;
                p.rotation += p.rotationSpeed;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();

                // Remove off-screen particles
                if (p.y > canvas.height) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            if (particles.length > 0) {
                animationId = requestAnimationFrame(animateConfetti);
            } else {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }
    </script>
</body>
</html>
